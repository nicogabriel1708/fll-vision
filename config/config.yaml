# ==============================================================================
# FLL-VISION (Production): Dual-Table (Doppeltisch) & Hybrid Motion+AI Config
# Optimized for NVIDIA DGX Spark (GB10 Grace Blackwell)
#
# Subpage Routes:
#   - /               : Public Match-Stream (Read-Only, Dual Team Table Streams)
#   - /control        : Volunteer Control (Mobile-Optimized)
#   - /configuration  : System Configuration (Doppeltisch & Einzeltische, Zoom, Heatmaps)
#   - /admin          : Admin Panel (User & Team Management)
# ==============================================================================

project:
  name: "fll-vision"
  season: "FLL 2026/27 BIOGLOW"
  log_level: "INFO"
  database_path: "/workspace/data/db/fll_vision.sqlite3"
  secret_key_env: "FLL_SECRET_KEY"

video:
  # Primary live camera source (default in production: connected USB camera /dev/video0;
  # can be switched to RTSP or .mp4 live in /control or /configuration)
  source: "/dev/video0"
  # Optional second camera source if Table 2 uses a separate physical camera
  source_table2: ""
  training_videos_dir: "/workspace/data/training_videos"
  width: 1920
  height: 1080
  # Set use_native_fps: true so video files (.mp4) always play at their exact original 1.0x speed
  use_native_fps: true
  fps: 30
  use_hw_decode: true
  # Disabled by default in live streaming to avoid continuous disk/FFmpeg write warnings
  save_annotated_video: false
  output_dir: "/workspace/data/outputs"

# Official FLL Double-Table (Doppeltisch: 2 tables side-by-side) & Individual Table Configuration
table:
  real_width_mm: 2362.0
  real_height_mm: 1143.0
  auto_detect_borders: false

  # Outer 4 corners of the entire Double-Table (Doppeltisch = both tables side-by-side)
  # Order: [Top-Left, Top-Right, Bottom-Right, Bottom-Left]
  double_table_corners_px:
    - [60, 140]
    - [1860, 140]
    - [1900, 960]
    - [20, 960]

  # 4 corners of Single Table 1 (Left / Red Team Table) in camera pixel coordinates
  src_corners_px:
    - [60, 140]
    - [960, 140]
    - [960, 960]
    - [20, 960]

  # 4 corners of Single Table 2 (Right / Blue Team Table) in camera pixel coordinates
  table2_corners_px:
    - [960, 140]
    - [1860, 140]
    - [1900, 960]
    - [960, 960]

  apply_table_roi_mask: true
  roi_padding_px: 15

  # Active zone on each single table ("full", "left_half", "right_half", "custom_ratio")
  # Since Table 1 and Table 2 each have their own 4 corners now, "full" uses the entire single table,
  # or "left_half" / "right_half" masks out an unused half on that table.
  active_half_mode: "full"
  active_x_ratio: [0.0, 1.00]
  active_y_ratio: [0.0, 1.00]

  table2_active_half_mode: "full"
  table2_active_x_ratio: [0.0, 1.00]
  table2_active_y_ratio: [0.0, 1.00]

  # Launch Area / Home zones in millimeter table coordinates [x_min, y_min, x_max, y_max]
  launch_areas_mm:
    left_home: [0.0, 0.0, 600.0, 1143.0]
    right_home: [1762.0, 0.0, 2362.0, 1143.0]

# Dual Team-Table Streams & UNIFIED Robot Auto-Zoom Configuration
streams:
  stream_width: 1080
  stream_height: 1080
  jpeg_quality: 85
  target_fps: 30

  auto_zoom:
    enabled: true
    # Unified zoom factor applied identically to both team streams (e.g. 2.2x zoom on robot)
    zoom_factor: 2.2
    # Minimum zoom factor when zoomed out / idle (1.0 = fits active table area without stretching)
    idle_zoom_factor: 1.0
    # Smooth exponential interpolation speed for camera pan & zoom
    pan_smoothing_alpha: 0.18
    zoom_smoothing_alpha: 0.12
    # Hold zoom on last known robot position for N frames before smoothly zooming out
    hold_frames_before_zoom_out: 90
    # Aspect-ratio border mode: "cover_crop" (zero side borders, zero stretching) or "blurred_backdrop"
    border_fill_mode: "cover_crop"

# Hybrid Motion + NVIDIA TensorRT YOLO Configuration
inference:
  weights_pt: "/workspace/models/fll_yolo11s.pt"
  engine_trt: "/workspace/models/fll_yolo11s.engine"
  auto_export_trt: true
  device: "cuda:0"
  imgsz: 960
  half_precision: true
  conf_threshold: 0.25
  iou_threshold: 0.45
  max_det: 25
  # Hybrid Motion Detection + AI classification fallback
  use_motion_discovery: true
  motion_min_area_px: 450
  motion_max_area_ratio: 0.18
  classes:
    robot: 0
    hand: 1
    attachment_jig: 2

# Tracking, Kalman Filter & Hand/Noise Rejection Logic
tracker:
  track_thresh: 0.25
  match_thresh: 0.80
  max_age_frames: 90
  min_hits: 1
  ema_alpha: 0.50
  max_robot_speed_mm_s: 1800.0
  stationary_noise_gate_mm: 2.5
  hand_veto:
    enabled: true
    overlap_iou_threshold: 0.08
    proximity_radius_mm: 115.0
    cooldown_frames: 6

# Web Server & WebSocket Hub
server:
  enabled: true
  host: "0.0.0.0"
  port: 8080
  stream_jpeg_quality: 85
  enable_heatmap: true
  heatmap_decay: 0.998
