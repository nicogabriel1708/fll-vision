<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="icon" href="/static/images/fll-logo-bg-white.png" />
		<title>{{AREA_TITLE}} – Login</title>
		<style>
			* { box-sizing: border-box; margin: 0; padding: 0; }
			body {
			    min-height: 100vh;
			    background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0f172a 75%);
			    color: #f8fafc;
			    font-family: system-ui, -apple-system, sans-serif;
			    display: flex;
			    align-items: center;
			    justify-content: center;
			    padding: 20px;
			}
			.login-card {
			    width: 100%;
			    max-width: 420px;
			    background: #1e293b;
			    border: 1px solid #334155;
			    border-radius: 16px;
			    padding: 32px 28px;
			    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
			}
			.badge {
			    display: inline-block;
			    background: rgba(56, 189, 248, 0.15);
			    color: #38bdf8;
			    border: 1px solid rgba(56, 189, 248, 0.35);
			    font-size: 11px;
			    font-weight: 700;
			    text-transform: uppercase;
			    letter-spacing: 0.1em;
			    padding: 4px 12px;
			    border-radius: 999px;
			    margin-bottom: 12px;
			}
			h1 { font-size: 24px; margin-bottom: 6px; color: #fff; }
			p.sub { font-size: 13.5px; color: #94a3b8; margin-bottom: 24px; line-height: 1.45; }
			.form-group { margin-bottom: 16px; }
			label { display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
			input {
			    width: 100%;
			    padding: 12px 14px;
			    background: #0f172a;
			    border: 1px solid #475569;
			    border-radius: 10px;
			    color: #fff;
			    font-size: 15px;
			}
			input:focus { outline: none; border-color: #38bdf8; }
			button {
			    width: 100%;
			    padding: 13px;
			    background: #0284c7;
			    color: #fff;
			    border: none;
			    border-radius: 10px;
			    font-size: 15px;
			    font-weight: 700;
			    cursor: pointer;
			    margin-top: 8px;
			    transition: background 0.15s;
			}
			button:hover { background: #0369a1; }
			.error-box {
			    background: rgba(239, 68, 68, 0.15);
			    border: 1px solid #ef4444;
			    color: #fca5a5;
			    padding: 10px 12px;
			    border-radius: 8px;
			    font-size: 13px;
			    margin-bottom: 16px;
			    display: {{ERROR_DISPLAY}};
			}
			.nav-links {
			    margin-top: 22px;
			    padding-top: 16px;
			    border-top: 1px solid #334155;
			    display: flex;
			    justify-content: space-between;
			    font-size: 12.5px;
			}
			.nav-links a { color: #38bdf8; text-decoration: none; }
			.nav-links a:hover { text-decoration: underline; }
		</style>
	</head>
	<body>
		<div class="login-card">
			<span class="badge">{{AREA_BADGE}}</span>
			<h1>{{AREA_TITLE}}</h1>
			<p class="sub">{{AREA_DESCRIPTION}}</p>

			<div class="error-box">{{ERROR_MESSAGE}}</div>

			<form method="POST" action="{{FORM_ACTION}}">
				<div class="form-group">
					<label for="username">Benutzername</label>
					<input id="username" name="username" type="text" required autocomplete="username" autofocus />
				</div>
				<div class="form-group">
					<label for="password">Passwort</label>
					<input id="password" name="password" type="password" required autocomplete="current-password" />
				</div>
				<button type="submit">🔐 Sicher anmelden</button>
			</form>

			<div class="nav-links">
				<a href="/">📺 Match-Stream</a>
				<a href="/login/control">Volunteer Control</a>
				<a href="/login/configuration">System Configuration</a>
				<a href="/login/admin">Admin Panel</a>
			</div>
		</div>
	</body>
</html>
